name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Resolve one version string shared by every artifact name and archive so
  # the whole run is self-identifying. Tag builds (refs/tags/v*) use the tag;
  # every other build uses the pyproject version disambiguated by short SHA
  # (e.g. 0.4.2-1a2b3c4) so main / PR artifacts never collide or masquerade
  # as a release.
  version:
    name: Determine version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: compute
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            BASE=$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -1)
            V="${BASE}-$(git rev-parse --short HEAD)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved artifact version: $V"

  qa:
    name: Lint and typecheck
    runs-on: ubuntu-22.04
    # Fast PR gate: ruff and mypy only. Deliberately does NOT build the
    # native extension -- mypy resolves the bindings through the checked-in
    # src/minihost/_core.pyi stub, so the whole job runs in well under a
    # minute instead of waiting on a JUCE download and a full C++ compile.
    # (The stub is kept honest against the real module by
    # tests/test_stub_coverage.py, which does run against a built wheel in
    # build-wheels.)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      # --only-group dev --no-install-project installs the exact ruff/mypy
      # pinned in uv.lock without compiling minihost, so local `make qa` and
      # this job cannot disagree because of a tool version bump.
      - name: Install quality tools
        run: uv sync --only-group dev --no-install-project

      # Lint covers the whole tree; formatting is checked for src/ and tests/
      # only (examples/ is not format-clean yet). Mirrors the Makefile targets.
      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check src/ tests/

      - name: Mypy
        run: uv run --no-sync mypy src/

  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact-name: cli-macos-universal
            cmake-args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: ubuntu-22.04
            artifact-name: cli-linux-x64
            cmake-args: ""
          - os: windows-2022
            artifact-name: cli-windows-x64
            cmake-args: -G "Visual Studio 17 2022"

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libcurl4-openssl-dev \
            pkg-config

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download JUCE
        run: python scripts/download_juce.py

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build --config Release

      # The two CLI binaries are independent implementations over the same
      # C API and are meant to be interchangeable, so they are run against
      # each other here. Everything needing a plugin skips -- no runner has
      # one installed -- but the resample, error-path and unknown-command
      # cases do not, and those are what would otherwise never be checked:
      # this job previously built the binaries and tested neither.
      - name: Install pytest
        run: python -m pip install pytest

      # No MINIHOST_C_BIN / MINIHOST_CPP_BIN needed: the test locates the
      # binaries under build/projects/... itself, which covers both the
      # Unix layout and the Windows Release/*.exe one.
      - name: CLI conformance (C vs C++)
        shell: bash
        run: python -m pytest -v tests/test_cli_conformance.py

      # Supervised scanning spawns a process per plugin, so it is the part of
      # the CLI most likely to differ per platform. The fake worker makes it
      # runnable on a runner with no plugins installed.
      - name: Supervised scan
        shell: bash
        run: python -m pytest -v tests/test_scan_supervised.py

      - name: Collect artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp build/projects/minihost_c/minihost_c dist/ || true
          cp build/projects/minihost_cpp/minihost_cpp dist/ || true
          cp build/projects/libminihost/libminihost.a dist/ || true
          cp projects/libminihost/minihost.h dist/

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp build/projects/minihost_c/Release/minihost_c.exe dist/ || true
          cp build/projects/minihost_cpp/Release/minihost_cpp.exe dist/ || true
          cp build/projects/libminihost/Release/minihost.lib dist/ || true
          cp projects/libminihost/minihost.h dist/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}-${{ needs.version.outputs.version }}
          path: dist/

  build-desktop:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [version]
    # Guard job: compiles the minihost_desktop GUI app (MINIHOST_BUILD_DESKTOP=ON,
    # MINIHOST_HEADLESS=OFF) so the ~7k lines of desktop code cannot silently
    # break under refactors of the C ABI or graph executor. Also runs a headless
    # smoke (--save-roundtrip) to prove the binary is not dead on arrival.
    # Backstop timeout well under the 6h default in case a headless-init hang
    # slips through. Raised from 45 to absorb the desktop test steps below: the
    # Linux leg additionally installs the headless Python package (a second,
    # independent build tree) so the render-parity/smoke tests can compare
    # against minihost.render_project. mac/windows legs skip that second build.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            cmake-args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            bin: build/projects/minihost_desktop/minihost_desktop.app/Contents/MacOS/minihost_desktop
            run-prefix: ""
            artifact-name: desktop-macos-universal
            artifact-path: build/projects/minihost_desktop/minihost_desktop.app
          - os: ubuntu-22.04
            cmake-args: ""
            bin: build/projects/minihost_desktop/minihost_desktop
            run-prefix: "xvfb-run -a"
            artifact-name: desktop-linux-x64
            artifact-path: build/projects/minihost_desktop/minihost_desktop
          - os: windows-2022
            cmake-args: -G "Visual Studio 17 2022"
            bin: build/projects/minihost_desktop/Release/minihost_desktop.exe
            run-prefix: ""
            artifact-name: desktop-windows-x64
            artifact-path: build/projects/minihost_desktop/Release/minihost_desktop.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libcurl4-openssl-dev \
            xvfb \
            pkg-config

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download JUCE
        run: python scripts/download_juce.py

      - name: Configure CMake
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DMINIHOST_BUILD_DESKTOP=ON -DMINIHOST_HEADLESS=OFF
          ${{ matrix.cmake-args }}

      - name: Build desktop app
        run: cmake --build build --config Release --target minihost_desktop

      - name: Headless smoke (save round-trip + error paths)
        shell: bash
        timeout-minutes: 5
        run: |
          BIN="${{ matrix.run-prefix }} ${{ matrix.bin }}"
          cat > smoke_project.json <<'EOF'
          {
            "minihost_project_version": 1,
            "sample_rate": 48000,
            "block_size": 512,
            "nodes": [
              {"id": "in",  "kind": "input",  "channels": 2, "source": "in.wav"},
              {"id": "out", "kind": "output", "channels": 2, "sink": "out.wav", "bit_depth": 24}
            ],
            "edges": [{"src": "in", "dst": "out"}]
          }
          EOF

          # Happy path: parse + re-save must succeed and produce output.
          $BIN --save-roundtrip=smoke_project.json
          test -f smoke_project.resaved.json
          echo "round-trip output:"
          cat smoke_project.resaved.json

          # Error paths: the binary must fail cleanly, not crash or succeed.
          # Missing project file -> exit 1 (load failure).
          set +e
          $BIN --render-project=does_not_exist.json ; code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1 for missing project, got $code"; exit 1; }

          # Empty option value -> exit 2 (usage error).
          set +e
          $BIN --render-project= ; code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2 for empty value, got $code"; exit 1; }
          echo "error-path exit codes OK"

      # Run the actual desktop test suite. The guard above only compiles the
      # binary and smoke-checks it; without the steps below the whole
      # @skip_if_no_desktop set (undo, autosave/recovery, headless-render smoke,
      # and C++/Python render parity) never runs in any CI job -- the wheels job
      # runs pytest but builds no desktop binary, and this job builds the binary
      # but never ran pytest.
      #
      # The suite is split by cost. The binary-only tests (undo, autosave) just
      # drive the desktop binary as a subprocess and import no minihost package,
      # so they run on ALL platforms -- cheap, and they cover the autosave/
      # recovery paths, which are the platform-sensitive ones (per-OS settings
      # dir, path handling, atomic rename). MINIHOST_DESKTOP_BIN pins the locator
      # to the artifact just built rather than its newest-mtime search; on Linux
      # the binary needs an X display, so pytest (which spawns it) runs under the
      # same xvfb prefix as the smoke step.
      - name: Install pytest
        run: python -m pip install pytest

      - name: Run desktop tests (binary only, all platforms)
        shell: bash
        timeout-minutes: 15
        env:
          MINIHOST_DESKTOP_BIN: ${{ matrix.bin }}
        run: >
          ${{ matrix.run-prefix }} python -m pytest -v
          tests/test_desktop_undo.py
          tests/test_desktop_autosave.py

      # The smoke and render-parity tests import the minihost package to compare
      # the desktop renderer against minihost.render_project(), which forces a
      # second (headless) build. That output is deterministic audio math, so one
      # platform is a strong signal -- run these on Linux only to keep the extra
      # compile to a single runner. scikit-build-core builds the wheel in its own
      # isolated tree, so this does not disturb the desktop `build/` just made.
      # Plugin-gated cases (MIDI-chain parity, plugin scan) skip cleanly with no
      # plugin installed on the runner.
      - name: Install minihost (headless) + numpy
        if: runner.os == 'Linux'
        run: python -m pip install . numpy

      - name: Run desktop tests (with package, Linux only)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 20
        env:
          MINIHOST_DESKTOP_BIN: ${{ matrix.bin }}
        run: >
          ${{ matrix.run-prefix }} python -m pytest -v
          tests/test_desktop_smoke.py
          tests/test_desktop_render_parity.py
          tests/test_desktop_pluginscan.py

      # Stage into a clean dir first so the upload has a predictable layout.
      # `cp -R` on the macOS matrix preserves the minihost_desktop.app bundle
      # wrapper -- uploading the .app path directly would flatten it to its
      # Contents/, losing the bundle. On Linux/Windows this just copies the
      # single binary. (Note: upload-artifact does not preserve the Unix +x
      # bit, so a binary downloaded directly from this run's artifact list may
      # need `chmod +x`. The release job restores +x before archiving, so the
      # published release tarballs extract as runnable. Desktop builds are
      # unsigned; macOS Gatekeeper / Windows SmartScreen will warn until
      # packaging/signing lands.)
      - name: Stage desktop artifact
        shell: bash
        run: |
          mkdir -p dist
          cp -R "${{ matrix.artifact-path }}" dist/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}-${{ needs.version.outputs.version }}
          path: dist/

  build-wheels:
    name: Build wheels (${{ matrix.os }}, ${{ matrix.cibw_archs }})
    runs-on: ${{ matrix.os }}
    needs: [version]
    # Backstop: build+test of all CPython versions completes in ~25 min; cap
    # well below the 6h default so a hang (e.g. a headless-init deadlock) fails
    # fast instead of burning runners.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            cibw_archs: arm64 x86_64
            artifact-name: wheels-macos
          - os: ubuntu-22.04
            cibw_archs: x86_64
            artifact-name: wheels-linux-x64
          - os: windows-2022
            cibw_archs: AMD64
            artifact-name: wheels-windows-x64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: '*-musllinux_*'
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y curl alsa-lib-devel freetype-devel fontconfig-devel
            gtk3-devel mesa-libGL-devel libcurl-devel webkit2gtk3-devel pkgconfig &&
            python3 {project}/scripts/download_juce.py
          CIBW_BEFORE_ALL_MACOS: python3 {project}/scripts/download_juce.py
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_BEFORE_ALL_WINDOWS: python {project}/scripts/download_juce.py
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: pytest {project}/tests -v
        run: cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}-${{ needs.version.outputs.version }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    needs: [version]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist-${{ needs.version.outputs.version }}
          path: dist/*.tar.gz

  aggregate:
    name: Aggregate artifacts
    runs-on: ubuntu-22.04
    needs: [version, build-cli, build-desktop, build-wheels, build-sdist]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Each platform's payload is packed here into one versioned zip, so
      # the downloaded artifact needs no renaming or re-foldering by hand:
      #
      #   cli/minihost-cli-<VER>-<platform>.zip
      #   desktop/minihost-desktop-<VER>-<platform>.zip
      #
      # Packing here rather than in the release job also fixes the +x bit
      # for everyone, not just tagged builds. upload-artifact does not
      # record the executable bit, so the payloads arrive non-executable;
      # zip does record it, so restoring +x before packing makes the
      # archives extract as runnable. Wheels and the sdist stay loose --
      # their filenames already carry the version and they need no mode
      # fixing.
      - name: Organize artifacts
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ROOT="$PWD"
          STAGE="$(mktemp -d)"
          mkdir -p release/cli release/desktop release/wheels release/sdist

          # pack <kind> <platform>: stage artifacts/<kind>-<platform>-<VER>,
          # restore the executable bit, zip it into release/<kind>/.
          pack() {
            kind="$1"
            platform="$2"
            src="artifacts/${kind}-${platform}-${VER}"
            if [ ! -d "$src" ]; then
              echo "missing (skipped): $src"
              return
            fi
            work="${STAGE}/${kind}-${platform}"
            mkdir -p "$work"
            cp -R "$src/." "$work/"
            find "$work" -type f \
              \( -name 'minihost_c' -o -name 'minihost_cpp' -o -name 'minihost_desktop' \) \
              -exec chmod +x {} + 2>/dev/null || true
            (cd "$work" && zip -qr \
              "${ROOT}/release/${kind}/minihost-${kind}-${VER}-${platform}.zip" .)
            echo "packed: release/${kind}/minihost-${kind}-${VER}-${platform}.zip"
          }

          for platform in macos-universal linux-x64 windows-x64; do
            pack cli "$platform"
            pack desktop "$platform"   # unsigned; see build-desktop notes
          done

          # Wheels (filenames already carry the package version)
          cp artifacts/wheels-*-${VER}/*.whl release/wheels/ || true

          # Source distribution
          cp artifacts/sdist-${VER}/*.tar.gz release/sdist/ || true

          # Summary
          echo "=== Release Contents (version ${VER}) ==="
          find release -type f | sort

      - uses: actions/upload-artifact@v7
        with:
          name: minihost-all-${{ needs.version.outputs.version }}
          path: release/

  release:
    name: Create release
    runs-on: ubuntu-22.04
    needs: [version, aggregate]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download aggregated artifacts
        uses: actions/download-artifact@v8
        with:
          name: minihost-all-${{ needs.version.outputs.version }}
          path: release

      # The aggregate job packs every platform as zip, which is what the
      # build artifact carries. Published releases keep their historical
      # shapes instead: tar.gz for macOS and Linux, zip for Windows, and
      # the platform-before-version naming that existing links use. The
      # zip -> unzip -> tar round trip is lossless for the executable
      # bit (zip records it, unzip restores it), so the tarballs still
      # extract as runnable without a chmod.
      - name: Create archives
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"

          repack_tar() {   # repack_tar <kind> <platform>
            kind="$1"
            platform="$2"
            src="release/${kind}/minihost-${kind}-${VER}-${platform}.zip"
            if [ ! -f "$src" ]; then
              echo "missing (skipped): $src"
              return
            fi
            work="${STAGE}/${kind}-${platform}"
            mkdir -p "$work"
            unzip -q "$src" -d "$work"
            tar -czf "minihost-${kind}-${platform}-${VER}.tar.gz" -C "$work" .
            echo "wrote minihost-${kind}-${platform}-${VER}.tar.gz"
          }

          copy_zip() {     # copy_zip <kind> <platform>
            kind="$1"
            platform="$2"
            src="release/${kind}/minihost-${kind}-${VER}-${platform}.zip"
            if [ ! -f "$src" ]; then
              echo "missing (skipped): $src"
              return
            fi
            cp "$src" "minihost-${kind}-${platform}-${VER}.zip"
            echo "wrote minihost-${kind}-${platform}-${VER}.zip"
          }

          for kind in cli desktop; do
            repack_tar "$kind" macos-universal
            repack_tar "$kind" linux-x64
            copy_zip   "$kind" windows-x64
          done

          # Wheels. upload-artifact drops empty directories, so
          # release/wheels is absent rather than empty when none was built.
          if compgen -G "release/wheels/*.whl" > /dev/null; then
            (cd release/wheels && zip -qr "../../minihost-wheels-${VER}.zip" .)
            echo "wrote minihost-wheels-${VER}.zip"
          else
            echo "no wheels to archive"
          fi

          echo "=== Release assets ==="
          ls -1 minihost-*.tar.gz minihost-*.zip 2>/dev/null || true
          ls -1 release/sdist/*.tar.gz 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            minihost-cli-macos-universal-${{ needs.version.outputs.version }}.tar.gz
            minihost-cli-linux-x64-${{ needs.version.outputs.version }}.tar.gz
            minihost-cli-windows-x64-${{ needs.version.outputs.version }}.zip
            minihost-desktop-macos-universal-${{ needs.version.outputs.version }}.tar.gz
            minihost-desktop-linux-x64-${{ needs.version.outputs.version }}.tar.gz
            minihost-desktop-windows-x64-${{ needs.version.outputs.version }}.zip
            minihost-wheels-${{ needs.version.outputs.version }}.zip
            release/sdist/*.tar.gz
          generate_release_notes: true
